name: Setup Rust
description: Stable toolchain, optional mold, Swatinem cache

inputs:
  shared-key:
    required: true
    description: rust-cache shared-key
  cache-targets:
    required: false
    default: "true"
    description: '"true" to cache target/, "false" for Release (too large)'
  mold:
    required: false
    default: "false"
    description: '"true" to install mold (Linux)'

runs:
  using: composite
  steps:
    - name: Install mold
      if: inputs.mold == 'true'
      uses: rui314/setup-mold@v1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cargo registry cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ". -> target"
        shared-key: ${{ inputs.shared-key }}
        cache-targets: ${{ inputs.cache-targets }}
