name: Setup pnpm (apps/desktop)
description: Node 24, Corepack pnpm from packageManager, store cache, frozen install

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Install pnpm from packageManager
      shell: bash
      working-directory: apps/desktop
      run: corepack install

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      working-directory: apps/desktop
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install frontend dependencies
      shell: bash
      working-directory: apps/desktop
      run: pnpm install --frozen-lockfile
