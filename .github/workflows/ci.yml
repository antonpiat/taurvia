name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Skip DWARF for CI: linking alloy + solana-sdk dominates this job.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: ci-linux
          mold: "true"

      # Skip taurvia-desktop: compiling Tauri needs WebKit GTK and only runs a
      # Specta bindings export. Bindings are committed; tsc covers the TS side.
      - name: Test crates
        run: cargo test --workspace --locked --exclude taurvia-desktop --lib

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Typecheck
        working-directory: apps/desktop
        run: pnpm exec tsc --noEmit
