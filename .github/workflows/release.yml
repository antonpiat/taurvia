name: Release

# Package only an explicit version tag. Never runs because tauri.conf.json
# changed on main. Rebuild a tag via workflow_dispatch after signing is added.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to rebuild (e.g. v0.5.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  gate:
    name: Verify tag and CI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vX.Y.Z, got: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify version, main, and CI
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          FILE=apps/desktop/src-tauri/tauri.conf.json
          VERSION=$(jq -r .version "$FILE")
          EXPECTED="v${VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match $FILE version $VERSION (expected $EXPECTED)"
            exit 1
          fi

          git fetch origin main
          SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Commit $SHA is not on origin/main. Only tag commits that are already on main."
            exit 1
          fi

          echo "Checking for a successful CI run on $SHA"
          # Tag after CI is green. Brief retry only covers the race where CI
          # just finished; do not sit here for a full CI cycle.
          for i in 1 2 3 4 5; do
            JSON=$(gh run list --workflow ci.yml --commit "$SHA" --limit 20 --json conclusion,status)
            echo "$JSON"

            if echo "$JSON" | jq -e '.[] | select(.conclusion == "success")' >/dev/null; then
              echo "CI passed on $SHA"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            in_flight=$(echo "$JSON" | jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')
            if [ "$in_flight" != "0" ]; then
              echo "CI still running; retry $i/5"
              sleep 20
              continue
            fi

            echo "No successful CI run on $SHA. Wait for CI on main, then re-run Release."
            exit 1
          done

          echo "Timed out waiting for CI on $SHA"
          exit 1

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --draft --title "Taurvia $TAG" --generate-notes
          fi

  build:
    name: Package ${{ matrix.platform }}
    needs: gate
    # Signing later: add `environment: release` here and set Apple/Windows secrets
    # on that environment. Do not enable it until then — it can queue the job.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 = glibc 2.35. ubuntu-latest (24.04) links glibc 2.39 and
          # AppImageHub flags it as not portable. Tauri v2 needs WebKitGTK 4.1,
          # which 22.04 still ships.
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          umask 022
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install mold
        if: matrix.platform == 'linux'
        uses: rui314/setup-mold@v1

      # Prefer Corepack over pnpm/action-setup: standalone mode crashes while
      # switching versions (integrity undefined), and the npm self-installer
      # breaks on Node 24 runners.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm from packageManager
        working-directory: apps/desktop
        run: corepack install

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        working-directory: apps/desktop
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo registry cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: release-${{ matrix.platform }}
          # Release objects are multi-GB; caching them is slower than a compile
          # on an infrequent tag. Registry/git cache still helps crate downloads.
          cache-targets: false

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Unsigned until Apple/Windows secrets exist. Then:
      #   Apple: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #          APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      #   Windows: see https://v2.tauri.app/distribute/sign/windows/
      #   Tauri updater: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      # Linux stays unsigned (optional later: GPG).
      - name: Build Tauri app (unsigned)
        working-directory: apps/desktop
        run: |
          umask 022
          pnpm tauri build

      # AppImageHub / firejail --appimage runs as a user that is not the squashfs
      # owner. linuxdeploy ships AppRun.wrapped as 770 → Permission denied.
      - name: Make AppImage contents world-executable
        if: matrix.platform == 'linux'
        run: bash apps/desktop/src-tauri/scripts/repack-appimage.sh

      # Workspace member, so Cargo writes to repo-root target/. Fall back to
      # src-tauri/target if Tauri ever isolates the crate.
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          found=0
          for bundle in target/release/bundle apps/desktop/src-tauri/target/release/bundle; do
            if [ ! -d "$bundle" ]; then
              continue
            fi
            found=1
            find "$bundle" -type f \( \
              -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
              -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
              -o -name '*.app.tar.gz' -o -name '*.sig' \
            \) -exec cp -v {} dist/ \;
          done
          if [ "$found" -eq 0 ]; then
            echo "No bundle directory. Listing target/release:"
            find target/release -maxdepth 3 -type d || true
            exit 1
          fi
          echo "Collected:"
          ls -la dist
          test -n "$(ls -A dist)"

      - name: Attach ${{ matrix.platform }} installers to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "dist/ is empty"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  publish:
    name: Publish GitHub Release
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      # Stay draft until every OS job succeeded. Uploads already landed on the draft.
      - name: Confirm Linux, Windows, and macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$names"
          echo "$names" | grep -Eq '\.(AppImage|deb|rpm)$' || { echo "missing Linux installer"; exit 1; }
          echo "$names" | grep -Eq '\.(msi|exe)$' || { echo "missing Windows installer"; exit 1; }
          echo "$names" | grep -Eq '\.(dmg|app\.tar\.gz)$' || { echo "missing macOS installer"; exit 1; }

      - name: Mark release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
