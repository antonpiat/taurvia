name: Release

# Package only an explicit version tag. Never runs because tauri.conf.json
# changed on main. Rebuild a tag via workflow_dispatch from main (uses this
# workflow file + packaging script; still compiles the tagged commit).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to rebuild (e.g. v0.5.4)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  gate:
    name: Verify tag and CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$REF_NAME"
          fi
          TAG="${TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vX.Y.Z, got: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify version, main, and CI
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          FILE=apps/desktop/src-tauri/tauri.conf.json
          VERSION=$(jq -r .version "$FILE")
          EXPECTED="v${VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match $FILE version $VERSION (expected $EXPECTED)"
            exit 1
          fi

          git fetch origin main
          SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Commit $SHA is not on origin/main. Only tag commits that are already on main."
            exit 1
          fi

          echo "Checking for a successful CI run on $SHA"
          # Tag after CI is green. Brief retry only covers the race where CI
          # just finished; do not sit here for a full CI cycle.
          for i in 1 2 3 4 5; do
            JSON=$(gh run list --workflow ci.yml --commit "$SHA" --limit 20 --json conclusion,status)
            echo "$JSON"

            if echo "$JSON" | jq -e '.[] | select(.conclusion == "success")' >/dev/null; then
              echo "CI passed on $SHA"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            in_flight=$(echo "$JSON" | jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')
            if [ "$in_flight" != "0" ]; then
              echo "CI still running; retry $i/5"
              sleep 20
              continue
            fi

            echo "No successful CI run on $SHA. Wait for CI on main, then re-run Release."
            exit 1
          done

          echo "Timed out waiting for CI on $SHA"
          exit 1

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --draft --title "Taurvia $TAG" --generate-notes
          fi

  # Own job (not the win/mac matrix) so linux-repack can start as soon as
  # Linux finishes, and a Windows/macOS failure does not skip AppImage zsync.
  package-linux:
    name: Package linux
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - name: Install Linux build dependencies
        run: |
          umask 022
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: release-linux
          cache-targets: "false"
          mold: "true"

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build Tauri app (unsigned)
        working-directory: apps/desktop
        run: |
          umask 022
          pnpm tauri build

      # Artifact for linux-repack. Do not attach this linuxdeploy image to the
      # GitHub Release (AppRun.wrapped is still 770).
      - name: Stage raw AppImage
        run: |
          set -euo pipefail
          mkdir -p dist-appimage-raw
          found=0
          for bundle in target/release/bundle/appimage \
            apps/desktop/src-tauri/target/release/bundle/appimage; do
            [ -d "$bundle" ] || continue
            shopt -s nullglob
            for f in "$bundle"/*.AppImage; do
              cp -v "$f" dist-appimage-raw/
              found=1
            done
          done
          test "$found" = 1
          ls -la dist-appimage-raw

      - name: Upload raw AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-raw
          path: dist-appimage-raw/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Collect .deb / .rpm
        run: |
          set -euo pipefail
          mkdir -p dist
          for bundle in target/release/bundle apps/desktop/src-tauri/target/release/bundle; do
            [ -d "$bundle" ] || continue
            find "$bundle" -type f \( -name '*.deb' -o -name '*.rpm' \) \
              -exec cp -v {} dist/ \;
          done
          echo "Collected:"
          ls -la dist
          test -n "$(ls -A dist)"

      - name: Attach Linux installers to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "dist/ is empty"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  package:
    name: Package ${{ matrix.platform }}
    needs: gate
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          shared-key: release-${{ matrix.platform }}
          cache-targets: "false"

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      # Unsigned until Apple/Windows secrets exist. Then:
      #   Apple: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      #          APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      #   Windows: see https://v2.tauri.app/distribute/sign/windows/
      #   Tauri updater: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      - name: Build Tauri app (unsigned)
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          found=0
          for bundle in target/release/bundle apps/desktop/src-tauri/target/release/bundle; do
            [ -d "$bundle" ] || continue
            find "$bundle" -type f \( \
              -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
              -o -name '*.app.tar.gz' -o -name '*.sig' \
            \) -exec cp -v {} dist/ \;
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "No bundle directory. Listing target/release:"
            find target/release -maxdepth 3 -type d || true
            exit 1
          fi
          echo "Collected:"
          ls -la dist
          test -n "$(ls -A dist)"

      - name: Attach ${{ matrix.platform }} installers to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "dist/ is empty"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # Starts when package-linux finishes — does not wait for Windows/macOS.
  # Re-run failed jobs retries only this job (no Rust rebuild).
  # Checkout github.sha so workflow_dispatch from main uses the current script
  # while still compiling the tagged commit in package-linux.
  linux-repack:
    name: Repack Linux AppImage
    needs: [gate, package-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout packaging script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install zsync
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsync

      - name: Download raw Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage-raw
          path: raw-appimage

      - name: Place AppImage for repack
        run: |
          set -euo pipefail
          mkdir -p target/release/bundle/appimage
          found=0
          while IFS= read -r -d '' f; do
            cp -v "$f" target/release/bundle/appimage/
            found=1
          done < <(find raw-appimage -type f -name '*.AppImage' -print0)
          test "$found" = 1
          ls -la target/release/bundle/appimage

      - name: Make AppImage contents world-executable
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash apps/desktop/src-tauri/scripts/repack-appimage.sh

      - name: Attach AppImage and zsync to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.zsync
          )
          if [ ${#files[@]} -lt 2 ]; then
            echo "expected AppImage and .zsync"
            ls -la target/release/bundle/appimage || true
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  publish:
    name: Publish GitHub Release
    needs: [gate, package-linux, package, linux-repack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm Linux, Windows, and macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$names"
          echo "$names" | grep -Eq '\.AppImage$' || { echo "missing Linux AppImage"; exit 1; }
          echo "$names" | grep -Eq '\.AppImage\.zsync$' || { echo "missing AppImage zsync"; exit 1; }
          echo "$names" | grep -Eq '\.(deb|rpm)$' || { echo "missing Linux installer"; exit 1; }
          echo "$names" | grep -Eq '\.(msi|exe)$' || { echo "missing Windows installer"; exit 1; }
          echo "$names" | grep -Eq '\.(dmg|app\.tar\.gz)$' || { echo "missing macOS installer"; exit 1; }

      - name: Mark release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
